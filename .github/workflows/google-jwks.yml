name: Refresh Google JWKS

# Google 登录公钥会定期轮换；国内服务器连不上 Google，由 runner 每天拉一次写到服务器。
# 后端每日 / 遇到未知 kid 时会重读该文件（见 briar-node/src/services/googleIdToken.ts）。
on:
  schedule:
    - cron: '17 */12 * * *'
  workflow_dispatch:

jobs:
  sync-jwks:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Google JWKS
        run: |
          curl -fsS --retry 3 --max-time 20 https://www.googleapis.com/oauth2/v3/certs -o google-jwks.json
          jq -e '.keys | length > 0' google-jwks.json >/dev/null
          echo "kids: $(jq -r '[.keys[].kid] | join(",")' google-jwks.json)"

      - name: Write JWKS to server
        env:
          PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          PROJECT_DIR="${PROJECT_DIR:-/home/ubuntu/github/briar-display}"
          JWKS_DIR="$PROJECT_DIR/packages/briar-node/data"
          ssh $SSH_OPTS ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "mkdir -p $JWKS_DIR && cat > $JWKS_DIR/google-jwks.json.tmp && mv $JWKS_DIR/google-jwks.json.tmp $JWKS_DIR/google-jwks.json && ls -l $JWKS_DIR/google-jwks.json" \
            < google-jwks.json
