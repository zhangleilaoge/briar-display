name: Build and Deploy

on:
  push:
    branches:
      - master
      - main
    # 白名单：仅影响部署产物的改动才触发流水线
    # （briar-agent / briar-skills / docs / briar-assets 等改动自动跳过；
    #   其他改动如需部署可在 Actions 页面手动 workflow_dispatch）
    paths:
      - 'packages/briar-node/**'
      - 'packages/briar-display/**'
      - 'packages/briar-shared/**'
      - 'packages/briar-scripts/**' # write-version.ts 被 CI 使用
      - 'scripts/deploy-docker.sh' # 部署脚本本身
      - 'Dockerfile' # 镜像定义
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'package.json' # 根依赖/脚本变化影响构建
      - 'bun.lock' # 锁定文件变化影响构建
      - 'Makefile'
      - 'biome.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  IMAGE: ccr.ccs.tencentyun.com/briar/briar-app

# 同一时刻只允许一个部署：新 push 取消卡住的旧 run（如推送镜像卡死）
concurrency:
  group: briar-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.DOCKER_GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Initialize project
        run: make init

      # CDN 上传流程不变：前端 dist 上传 COS 公开桶
      - name: Build and upload to CDN
        run: make build-cdn

      # ============ 镜像：构建并推送 CCR ============
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Tencent CCR
        uses: docker/login-action@v3
        with:
          registry: ccr.ccs.tencentyun.com
          username: ${{ secrets.CCR_USERNAME }}
          password: ${{ secrets.CCR_PASSWORD }}

      - name: Build and push image
        run: |
          # --provenance=false：buildx 默认附带的 attestation manifest 会让 CCR 推送卡死
          # BRIAR_TX_BUCKET_DOMAIN：从 .env（make init 拷入）读桶域名，让镜像内前端构建带 CDN 前缀
          CDN_DOMAIN=$(grep -E '^BRIAR_TX_BUCKET_DOMAIN=' .env | cut -d= -f2- | tr -d '"' | tr -d ' ')
          docker buildx build \
            --provenance=false \
            --build-arg BRIAR_COMMIT=${{ github.sha }} \
            --build-arg BRIAR_BRANCH=${{ github.ref_name }} \
            --build-arg BRIAR_TX_BUCKET_DOMAIN="$CDN_DOMAIN" \
            -t $IMAGE:${{ github.sha }} \
            -t $IMAGE:latest \
            --push .

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # ============ 服务器：更新代码 + docker compose 部署 ============
      - name: Deploy to server (SSH)
        env:
          PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          PROJECT_DIR="${PROJECT_DIR:-/home/ubuntu/github/briar-display}"
          echo "部署到 $PROJECT_DIR，commit=${{ github.sha }}"
          # 先把服务器代码更新到目标 commit，确保执行的是新版 deploy-docker.sh 与 compose 文件
          ssh $SSH_OPTS ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd $PROJECT_DIR && git fetch origin && (git checkout master 2>/dev/null || true) && git reset --hard origin/master && DEPLOY_RUN_ID=${{ github.run_id }} BRIAR_IMAGE_TAG=${{ github.sha }} bash scripts/deploy-docker.sh"

      # ============ 健康检查 ============
      - name: Health check
        run: |
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          echo "等待服务重启..."
          sleep 6
          for i in 1 2 3 4 5 6 7 8; do
            RESP=$(ssh $SSH_OPTS ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "curl -s http://127.0.0.1:3888/api/version" || true)
            echo "Attempt $i: $RESP"
            if echo "$RESP" | grep -q '"success":true'; then
              echo "✅ 后端 /api/version 正常"
              # 校验前后端 commit 一致
              FE=$(echo "$RESP" | grep -o '"frontend"[^}]*"commit":"[^"]*"' | grep -o '"commit":"[^"]*"' | tail -1 | cut -d'"' -f4)
              BE=$(echo "$RESP" | grep -o '"backend"[^}]*"commit":"[^"]*"' | grep -o '"commit":"[^"]*"' | tail -1 | cut -d'"' -f4)
              echo "frontend.commit=$FE backend.commit=$BE"
              exit 0
            fi
            sleep 4
          done
          echo "❌ 健康检查失败，/api/version 无响应，请到服务器检查: docker compose logs app"
          exit 1

      # ============ 部署历史（写入 briar-assets 审计） ============
      - name: Append deploy history
        if: always()
        env:
          PROJECT_DIR: ${{ secrets.DEPLOY_PROJECT_DIR }}
        run: |
          # 前置步骤失败时（if: always）Setup SSH 可能没跑过，这里自带密钥初始化
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          PROJECT_DIR="${PROJECT_DIR:-/home/ubuntu/github/briar-display}"
          AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          RECORD="{\"commit\":\"${{ github.sha }}\",\"ref\":\"${{ github.ref }}\",\"actor\":\"${{ github.actor }}\",\"status\":\"${{ job.status }}\",\"at\":\"$AT\",\"run\":\"${{ github.run_id }}\"}"
          ssh $SSH_OPTS ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            "cd $PROJECT_DIR && mkdir -p briar-assets && echo '$RECORD' >> briar-assets/deploy-history.jsonl && echo '记录已追加' && tail -n 1 briar-assets/deploy-history.jsonl"
