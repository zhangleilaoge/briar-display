name: Build and Deploy to CDN

on:
  push:
    branches:
      - master
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.DOCKER_GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Initialize project
        run: make init

      - name: Build and upload to CDN
        run: make build-cdn

      - name: Show runner public IP
        run: |
          echo "Runner public IP: $(curl -s https://api.ipify.org)"

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync web assets to server
        run: |
          REMOTE_DIR="/home/ubuntu/Documents/briar-display/packages/briar-display/web"
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=3"
          ssh $SSH_OPTS ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "mkdir -p $REMOTE_DIR"
          rsync -avz --delete \
            -e "ssh $SSH_OPTS" \
            packages/briar-display/dist/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:$REMOTE_DIR

      # Backend deployment is done manually via SSH due to unstable server network to GitHub
