# Lefthook 配置
# https://github.com/evilmartians/lefthook

# 提交前检查
pre-commit:
  parallel: true
  commands:
    # Biome 检查和格式化
    biome-check:
      glob: "*.{js,ts,jsx,tsx,json,cjs,mjs}"
      run: bun biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true

    # 类型检查
    typecheck-shared:
      glob: "packages/briar-shared/**/*.{ts,tsx}"
      run: bun run --filter @briar/shared typecheck

    # 类型检查 (node)
    typecheck-node:
      glob: "packages/briar-node/**/*.{ts,tsx}"
      run: bun run --filter @briar/node typecheck

    # 软删除约定：业务表禁止硬 DELETE（仅白名单例外）
    soft-delete-guard:
      glob: "packages/briar-node/**/*.{ts,tsx,sql}"
      run: bun test packages/briar-node/src/db/softDelete.guard.test.ts

