# ========== stardew.site ==========
server {
    listen 80;
    server_name stardew.site www.stardew.site;
    return 301 https://stardew.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stardew.site;

    ssl_certificate     /etc/nginx/stardew.site_bundle.crt;
    ssl_certificate_key /etc/nginx/stardew.site.key;

    return 301 https://stardew.site$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stardew.site;

    ssl_certificate     /etc/nginx/stardew.site_bundle.crt;
    ssl_certificate_key /etc/nginx/stardew.site.key;

    # 上传大小限制（与后端 MAX_FILE_SIZE 10MB 对齐）
    client_max_body_size 10m;

    # Gzip（可保留）
    gzip on;
    gzip_static on;
    gzip_types text/plain application/x-javascript text/css application/xml
               text/javascript application/x-httpd-php image/jpeg image/gif image/png;

    # 根路径落地页（备案合规）
    location = / {
        proxy_pass http://127.0.0.1:3888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /briar-display/ {
        proxy_pass http://127.0.0.1:3888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3888/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}