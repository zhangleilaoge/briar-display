# ========== xiaobuzi.cn ==========
server {
    listen 80;
    server_name xiaobuzi.cn www.xiaobuzi.cn;
    return 301 https://xiaobuzi.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.xiaobuzi.cn;

    ssl_certificate     /etc/nginx/xiaobuzi.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/xiaobuzi.cn.key;

    return 301 https://xiaobuzi.cn$request_uri;
}

server {
    listen 443 ssl http2;
    server_name xiaobuzi.cn;

    ssl_certificate     /etc/nginx/xiaobuzi.cn_bundle.crt;
    ssl_certificate_key /etc/nginx/xiaobuzi.cn.key;

    # 上传大小限制（与后端 MAX_FILE_SIZE 10MB 对齐）
    client_max_body_size 10m;

    # Gzip（可保留）
    gzip on;
    gzip_static on;
    gzip_types text/plain application/x-javascript text/css application/xml
               text/javascript application/x-httpd-php image/jpeg image/gif image/png;

    # 根路径落地页（备案合规）
    location = / {
        proxy_pass http://127.0.0.1:3888/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # robots.txt：拦 AI 爬虫嗅探 /api/（GrokBot、Claude-SearchBot 等均遵守 robots 协议）
    # 直接由 nginx 返回，不进 node、不落 request_logs
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /api/\n";
    }

    location /briar/ {
        proxy_pass http://127.0.0.1:3888;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3888/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket（SSH 控制台 /api/terminal/ws）
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        # 长连接：覆盖默认 60s 代理超时（终端空闲由后端 30min 超时控制）
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}